[versions]
kotlin = "2.3.20"
compose-multiplatform = "1.11.0-beta01"
# Compose MP 1.11 no longer ships a current material3 via the `compose.material3`
# accessor (it maps to 1.9.0). 1.11.0-alpha05 is the release built against 1.11.0-beta01.
compose-material3 = "1.11.0-alpha05"
kotlinx-serialization = "1.10.0"
kotlinx-coroutines = "1.10.2"
jna = "5.17.0"
# Android Gradle Plugin (DECISIONS D10): the KMP-native `com.android.kotlin.multiplatform.library` plugin.
agp = "9.1.1"
# :androidApp (DECISIONS D11). 1.12.x targets compileSdk 36.
androidx-activity = "1.12.4"
# :androidApp instrumented tests (androidTest), run on a device/emulator.
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"
junit = "4.13.2"
# Coil 3 image loading (DECISIONS: Coil). 3.4.x is the newest line built against Kotlin 2.3 / Compose 1.9;
# 3.5+ requires Kotlin 2.4 and Compose 1.11.1+.
coil = "3.4.0"
# Closed-app notifications on Android (D47): UnifiedPush receives standard Web Push from the pod. The embedded FCM
# distributor makes the app its own distributor on phones without one (Play services, via the UnifiedPush project's
# public Web Push -> FCM gateway); no Firebase project or Google credentials anywhere.
unifiedpush-connector = "3.3.5"
unifiedpush-embedded-fcm = "3.1.0"

[libraries]
# Compose UI test harness (runComposeUiTest), used by the simulator and desktop smoke tests.
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
junit = { module = "junit:junit", version.ref = "junit" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
unifiedpush-connector = { module = "org.unifiedpush.android:connector", version.ref = "unifiedpush-connector" }
unifiedpush-embedded-fcm = { module = "org.unifiedpush.android:embedded-fcm-distributor", version.ref = "unifiedpush-embedded-fcm" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
