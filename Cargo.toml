[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/client-core",
    "crates/client-ffi",
    "crates/pod-core",
    "crates/pod-host",
    "crates/app-pixelfed",
    "crates/app-recipes",
    "crates/app-collections",
    "crates/app-events",
    "crates/app-monitor",
    "crates/web-extract",
    "crates/server",
    "fake-pixelfed",
    "crates/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { path = "crates/protocol" }
client-core = { path = "crates/client-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
uniffi = "0.29"
rusqlite = { version = "0.39", features = ["bundled"] }

# Dev and test builds keep line numbers in backtraces but drop full debug
# info: target/ shrinks several-fold, which keeps cloud sessions inside their
# disk allowance. For a debugger session, set CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
