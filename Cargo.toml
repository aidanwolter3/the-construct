[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/construct-elements",
    "crates/client-core",
    "crates/construct-render",
    "crates/construct-web",
    "crates/construct-sim",
    "crates/pod-core",
    "crates/pod-host",
    "crates/source-pixelfed",
    "crates/source-collections",
    "crates/source-events",
    "crates/source-monitor",
    "crates/source-agents",
    "crates/source-shell",
    "crates/web-extract",
    "crates/agent",
    "crates/server",
    "fake-pixelfed",
    "crates/e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
protocol = { path = "crates/protocol" }
client-core = { path = "crates/client-core" }
construct-elements = { path = "crates/construct-elements" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }

# Dev and test builds keep line numbers in backtraces but drop full debug
# info: target/ shrinks several-fold, which keeps cloud sessions inside their
# disk allowance. For a debugger session, set CARGO_PROFILE_DEV_DEBUG=true.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The web client's build (scripts/web_build.sh, decision `web-gpu`): optimized for size, since a browser
# downloads it.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
