# Fake Pixelfed upstream for the staging pod. Stateless (in-memory, fixtures compiled in), so it
# may stop when idle; the Fly proxy starts it again on the next request (state resets, which is fine).
# From the repo root:
#   flyctl deploy . --config deploy/fly/fake-pixelfed.toml --dockerfile crates/fake-pixelfed/Dockerfile --remote-only

app = "the-construct-fake-pixelfed"
primary_region = "dfw"

[env]
  FAKE_PIXELFED_ADDR = "0.0.0.0:8081"
  # Every media/profile/status URL in the fixtures points here (the pod's media proxy fetches them).
  FAKE_PIXELFED_PUBLIC_URL = "https://the-construct-fake-pixelfed.fly.dev"
  # Admin/fault endpoints stay off on the public internet.
  FAKE_PIXELFED_ADMIN = "0"
  # With admin off only construct:// and loopback redirect URIs register, plus these exact ones:
  # the staging pod's Android App Link (decision android-app-link-sign-in-redirect).
  FAKE_PIXELFED_EXTRA_REDIRECTS = "https://the-construct-pod.fly.dev/oauth/android"
  RUST_LOG = "info"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
