# Staging pod on Fly.io. Deployed by .github/workflows/ci.yml on push to main; by hand, from the repo root:
#   flyctl deploy . --config deploy/fly/pod.toml --dockerfile deploy/pod.Dockerfile --remote-only
# Secrets (never in this file): `flyctl secrets set -a the-construct-pod CONSTRUCT_INFER_API_KEY=...` (Collections
# `model` fields and the `llm` extractor of fetch fillers).
# CONSTRUCT_SECRETS_KEY seals the upstream Pixelfed tokens in the pod databases (docs/server.md
# "Configuration"). Set it once; existing plaintext rows are sealed when each pod next opens:
#   flyctl secrets set -a the-construct-pod CONSTRUCT_SECRETS_KEY="$(openssl rand -base64 32)"
# Keep a copy in a password manager: without it, sealed sign-ins read as signed out. To rotate, set
# "<new>,<old>", let the pods open once (they re-seal under <new>), then set "<new>".
# Pods (D46): one server, a pod per user. Admin pods and their codes are made on the machine, never in git:
#   fly ssh console -a the-construct-pod -C "/server pods create <name>"     (prints the pod code once)
#   fly ssh console -a the-construct-pod -C "/server pods list"

app = "the-construct-pod"
primary_region = "dfw"

[env]
  CONSTRUCT_ADDR = "0.0.0.0:8080"
  CONSTRUCT_DATA_DIR = "/data"
  RUST_LOG = "info"
  # The default instance ("Sign in with Pixelfed") is the fake Pixelfed app
  # (fake-pixelfed/fly.toml).
  PIXELFED_INSTANCE_URL = "https://the-construct-fake-pixelfed.fly.dev"
  # The sign-in screen's server box accepts any public HTTPS Pixelfed instance (D45).
  PIXELFED_ALLOWED_INSTANCES = "*"
  # The Android app's sign-in redirect is a verified App Link on this host (decision
  # android-app-link-sign-in-redirect); construct://oauth stays accepted for older builds.
  PIXELFED_EXTRA_REDIRECTS = "https://the-construct-pod.fly.dev/oauth/android"
  # Signing certs whose Android builds may open that link, served in /.well-known/assetlinks.json.
  # Not secret (every APK carries its cert), so they can live here; unset, the endpoint is 404 and
  # Android 12+ builds keep construct://oauth. Get a fingerprint with
  #   keytool -list -v -keystore <keystore> -alias <alias> | grep SHA256
  # (debug: -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android), or run
  # `./gradlew :androidApp:signingReport`. Comma-separated; add the release key's in front once
  # there is one. Today: the developer's debug key only (no release signing config yet).
  CONSTRUCT_ANDROID_CERT_SHA256 = "87:F9:6B:96:E4:A5:AE:BE:06:AC:33:BD:53:40:5A:59:DF:21:18:78:0B:56:BA:FB:1C:29:7D:BD:E6:78:80:9C"
  # Anyone may make a temporary pod (24 h, then deleted): how Claude sessions and
  # visitors try staging. Temporary pods only reach the fake Pixelfed; real use
  # (and real Pixelfed servers) goes in admin pods (D46).
  CONSTRUCT_TEMP_PODS = "1"
  # Storage on the 1 GB volume below (decision `pod-storage-limits`; these are
  # the defaults, spelled out). Each temporary pod's uploads stay under 25 MiB
  # and an admin pod's under 500 MiB; whatever the total, uploads and new
  # temporary pods stop while less than 100 MiB is free, so SQLite writes
  # (sessions, sign-ins) keep working. 50 temporary pods at most.
  CONSTRUCT_TEMP_POD_MAX = "50"
  CONSTRUCT_UPLOAD_MAX_BYTES = "20971520"
  CONSTRUCT_TEMP_POD_UPLOAD_QUOTA_BYTES = "26214400"
  CONSTRUCT_POD_UPLOAD_QUOTA_BYTES = "524288000"
  CONSTRUCT_MIN_FREE_DISK_BYTES = "104857600"
  # GET /metrics (Prometheus) on a port of its own, outside [http_service], so
  # only Fly's private network reaches it; Fly scrapes it into its Grafana
  # (fly-metrics.net). Decision `server-monitoring`.
  CONSTRUCT_METRICS_ADDR = "[::]:9091"

[metrics]
  port = 9091
  path = "/metrics"

[mounts]
  source = "pod_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: clients hold SSE streams open for live layout updates.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
