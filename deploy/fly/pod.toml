# Staging pod on Fly.io. Deployed by .github/workflows/deploy.yml on push to main; by hand, from the repo root:
#   flyctl deploy . --config deploy/fly/pod.toml --dockerfile deploy/pod.Dockerfile --remote-only
# Secrets (never in this file): `flyctl secrets set -a the-construct-pod ANTHROPIC_API_KEY=...`

app = "the-construct-pod"
primary_region = "dfw"

[env]
  CONSTRUCT_ADDR = "0.0.0.0:8080"
  CONSTRUCT_DATA_DIR = "/data"
  RUST_LOG = "info"
  # Staging talks to the fake Pixelfed app (deploy/fly/fake-pixelfed.toml), never a real instance.
  PIXELFED_INSTANCE_URL = "https://the-construct-fake-pixelfed.fly.dev"
  # Test environment: any fake account may sign in and replace the stored one.
  PIXELFED_ALLOW_ACCOUNT_CHANGE = "1"
  CONSTRUCT_LLM_PROVIDER = "auto"

[mounts]
  source = "pod_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: clients hold SSE streams open for live layout updates.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
