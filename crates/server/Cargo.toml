[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
protocol = { workspace = true, features = ["schema"] }
serde_json.workspace = true
rusqlite.workspace = true
# `http2` enables h2c (prior knowledge) alongside HTTP/1.1 per DESIGN.md M2.
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
# Async upstream client (Pixelfed). rustls only; `stream` for the media proxy.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# `stream::unfold` for the size-capped media proxy body.
futures-util = { version = "0.3", default-features = false }
# Layout agent (M7): RFC 6902 patches and the component registry (JSON Schema).
json-patch = "4"
schemars = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
fake-pixelfed = { path = "../fake-pixelfed" }
