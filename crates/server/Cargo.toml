[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The pod binary: reads env, builds the adapters (compile-time, D40) and serves
# them with `pod-core`. The library is that composition, for tests.

[lib]
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
pod-core = { path = "../pod-core" }
pod-host = { path = "../pod-host" }
app-pixelfed = { path = "../app-pixelfed" }
app-recipes = { path = "../app-recipes" }
protocol = { workspace = true }
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
fake-pixelfed = { path = "../fake-pixelfed" }
