[package]
name = "e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# End-to-end harness: the real pod (`server::app`) and the client-core engine
# in-process, against the fake Pixelfed (default) or a real instance
# (E2E_UPSTREAM=real). See README "End-to-end tests".

[dependencies]
server = { path = "../server" }
fake-pixelfed = { path = "../fake-pixelfed" }
client-core.workspace = true
serde_json.workspace = true
reqwest.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
tower = { version = "0.5", features = ["util"] }
