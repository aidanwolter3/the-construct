[package]
name = "app-watcher"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The Events app (app id `watcher`; decision `collection-fillers`): the
# system collection `events`, filled by one fetch filler per website and
# watched by alerts. Once the Watcher (issue #58): its old `watcher_*`
# tables stay for their migrations and are moved into `events` once.

[dependencies]
pod-core = { path = "../pod-core" }
web-extract = { path = "../web-extract" }
app-collections = { path = "../app-collections" }
protocol = { workspace = true }
serde_json.workspace = true
rusqlite.workspace = true
serde.workspace = true
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
