[package]
name = "source-shell"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The `shell` blueprint (decision `blueprints-and-home`): the default home
# layout every pod's `home` references, a dock of the pod's layouts drawn
# from data the device provides. No data of its own.

[dependencies]
pod-core = { path = "../pod-core" }
protocol = { workspace = true }
