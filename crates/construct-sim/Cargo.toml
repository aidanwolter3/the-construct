[package]
name = "construct-sim"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The headless simulator (docs/simulator.md): a script drives a session of the
# Rust engine (construct-render) on fixture bundles or a live pod, drawn on the
# CPU to PNGs, so CI needs no GPU and no JVM.

[dependencies]
construct-render = { path = "../construct-render", default-features = false, features = ["remote"] }
protocol = { workspace = true }
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

