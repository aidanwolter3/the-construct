[package]
name = "construct-render"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The Rust rendering engine (decision `rust-render-engine`): a plumbing
# UiNode tree and its data laid out with taffy, turned into a scene of SDF
# quads and text runs, and drawn by the CPU rasterizer (always built) or by
# wgpu (feature `gpu`): offscreen, in a desktop window (`window`) or on an
# Android surface. The pod builds it without `gpu`, for MCP previews.

[features]
default = ["gpu"]
# The wgpu pipeline: WGSL instanced SDF quads plus glyphon text, offscreen.
gpu = ["dep:wgpu", "dep:glyphon", "dep:pollster", "dep:bytemuck"]
# A native window (winit): the desktop viewer and the Android activity.
# On the desktop it also serves screen readers (AccessKit).
window = ["gpu", "dep:winit", "dep:jni", "dep:accesskit_winit"]
# A live session over a pod (`remote`): run by the engine (`client-core`:
# its cache, outbox and event stream), images over HTTP.
remote = [
    "dep:reqwest", "dep:client-core", "image/jpeg",
    "dep:web-push-native", "dep:base64", "dep:getrandom",
]
# The `construct-viewer` binary (`--pod` runs it on a pod).
viewer = ["window", "remote"]

[dependencies]
protocol = { workspace = true }
serde.workspace = true
serde_json.workspace = true
taffy = { version = "0.15", default-features = false, features = ["std", "flexbox", "taffy_tree"] }
cosmic-text = "0.19"
# Icon paths (SVG path data) to coverage masks; already under cosmic-text.
zeno = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
wgpu = { version = "30", optional = true }
glyphon = { version = "0.12", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
winit = { version = "0.30", optional = true }
# The semantic tree as an accessibility tree (`accessibility`): plain data.
accesskit = "0.25"
# `remote`: the pod's HTTP API, and the engine the Compose clients run.
reqwest = { workspace = true, optional = true }
client-core = { workspace = true, optional = true }
# `remote`: push messages (`push`): Web Push decryption (RFC 8291) with
# this device's own keys, as the pod encrypts them.
web-push-native = { version = "0.5", default-features = false, optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }

[target.'cfg(not(target_os = "android"))'.dependencies]
# Screen readers on the desktop: VoiceOver (macOS) and Narrator (Windows).
# Not Orca on Linux: AccessKit's AT-SPI adapter pulls in zvariant, which
# is unmaintained (RUSTSEC-2026-0370) until AccessKit moves to zbus 6.
# Android's adapter needs a Java class (a dex) the NativeActivity lacks.
accesskit_winit = { version = "0.34", optional = true, default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "android")'.dependencies]
# NativeActivity glue (winit re-exports android-activity).
winit = { version = "0.30", optional = true, features = ["android-native-activity"] }
# The window's insets (system bars, cutout, keyboard) through the Android SDK.
jni = { version = "0.22", optional = true }

[[bin]]
name = "construct-viewer"
required-features = ["viewer"]

[lib]
# cdylib: the Android NativeActivity library (`android_main`).
crate-type = ["lib", "cdylib"]

[dev-dependencies]

[[example]]
name = "pod_shots"
required-features = ["remote"]
