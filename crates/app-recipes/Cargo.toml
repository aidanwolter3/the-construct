[package]
name = "app-recipes"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The recipes adapter: a recipe collection in the pod's own SQLite
# (`recipes_*` tables) and the `recipes` app. No upstream.

[dependencies]
pod-core = { path = "../pod-core" }
protocol = { workspace = true }
serde_json.workspace = true
rusqlite.workspace = true
serde.workspace = true
axum = { version = "0.8", features = ["http2"] }

[features]
# The made-up test recipes (`db::seed_test_recipes`). Tests only: enable it
# from a dev-dependency, never from a normal one.
test-seed = []

[dev-dependencies]
# This crate's own integration tests seed the test recipes too.
app-recipes = { path = ".", features = ["test-seed"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3"
