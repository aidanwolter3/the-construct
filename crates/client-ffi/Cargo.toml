[package]
name = "client-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "client_ffi"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Only the uniffi-bindgen binary needs uniffi's CLI (clap, askama, ...). Keep it
# out of the cdylib build: `cargo run -p client-ffi --features bindgen --bin uniffi-bindgen`.
bindgen = ["uniffi/cli"]

[dependencies]
client-core.workspace = true
serde_json.workspace = true
uniffi.workspace = true

# Android: forward stdout/stderr (client-core's println!/eprintln!) to logcat.
[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
