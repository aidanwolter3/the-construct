[package]
name = "pod-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The generic pod: workspaces, layout files and versions, schema negotiation,
# SSE, sessions and sign-ins, the store. Knows apps only through `AppAdapter`.

[dependencies]
protocol = { workspace = true }
serde_json.workspace = true
rusqlite.workspace = true
serde.workspace = true
# `http2` enables h2c (prior knowledge) alongside HTTP/1.1 per DESIGN.md M2.
axum = { version = "0.8", features = ["http2"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
# `stream::unfold` for the SSE stream.
futures-util = { version = "0.3", default-features = false }
# Content-addressed layout blobs.
zstd = "0.13"
# Outbound HTTP: Web Push deliveries (D47) and adapters' upstreams, through
# the public-only resolver in `net` for user-picked hosts.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Web Push (RFC 8291 encryption, RFC 8292 VAPID), no HTTP stack of its own.
web-push-native = "0.5"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
http = "1"
