[package]
name = "client-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
# OAuth2 PKCE (auth.rs): CSPRNG verifier/state, S256 challenge.
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
# M7 push channel (events.rs): async reqwest stream read in short slices on a
# private current-thread runtime, so a dropped engine closes it promptly.
tokio = { version = "1", features = ["rt", "time", "net"] }
# Attachments (attachments.rs, D49): decode a picked photo, apply its EXIF
# rotation, scale it down and re-encode it as a JPEG without metadata.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# Default SecureStore on macOS: the login Keychain. Never compiled for Android.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[dev-dependencies]
# tests/integration/outbox.rs runs the real server (in-process, random port).
server = { path = "../server" }
# tests/integration/auth.rs runs the fake Pixelfed upstream behind the real pod.
fake-pixelfed = { path = "../fake-pixelfed" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
# tests/integration/pod_host.rs keeps the host's pods in a temporary directory.
tempfile = "3"
# tests/integration/attachments.rs writes test photos.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
