name: Release

# The Construct's installable builds (decision `rust-clients`):
#   - Android: scripts/android_native.sh --release --unsigned builds a release APK (not debuggable) with no signing
#     secrets; the android-sign job, which runs no cargo and restores no cache, signs it with scripts/android_sign.sh
#     (#442). Signed with the release key when these secrets of the `release` Environment are set (#437: only `v*`
#     tags may use it, with the developer's approval), else with a throwaway debug key (and a warning; pull requests
#     never get the release key):
#       ANDROID_KEYSTORE_BASE64     the keystore file (.jks or .p12), base64 on one line
#       ANDROID_KEYSTORE_PASSWORD   its password
#       ANDROID_KEY_ALIAS           the key's alias in it
#       ANDROID_KEY_PASSWORD        the key's password (optional: the keystore's password when unset)
#     A pod's App Link sign-in redirect needs this key's SHA-256 fingerprint in the pod's CONSTRUCT_ANDROID_CERT_SHA256
#     (docs/server.md); the job prints it.
#   - macOS: scripts/macos_app.sh, The Construct.app in a .dmg (Apple Silicon, signed ad hoc, not notarized).
#
# A tag `v<version>` (e.g. v0.2.0) publishes both as a GitHub release; a manual run uploads them as the run's
# artifacts. Pull requests that change the build scripts run it too, unsigned and unpublished, so a broken release
# build shows before it merges. The version code is the run number, so each release installs over the previous one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/android_native.sh
      - scripts/android_sign.sh
      - scripts/macos_app.sh
      - crates/construct-render/android/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [[ $REF_TYPE == tag ]]; then name=${REF_NAME#v}; else name="0.1.0-dev.$RUN"; fi
          [[ $name =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "bad version '$name'"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$RUN" >> "$GITHUB_OUTPUT"
          # The build id the apps report to the pod (decision `device-versions`).
          echo "build=$(CONSTRUCT_VERSION_NAME=$name scripts/build_id.sh)" >> "$GITHUB_OUTPUT"

  # Builds the APK unsigned. No signing secret is in this job: its steps compile every dependency's build script and
  # proc-macro and restore a cache, any of which could read a key on disk or in the environment.
  android:
    name: Android release APK (unsigned)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the pinned Rust (rust-toolchain.toml) and the Android target
        run: rustup toolchain install && rustup target add aarch64-linux-android
      # The root Cargo.toml (its [profile]s) is in the key: rust-cache hashes only Cargo.lock and the members'
      # manifests, so a profile change would restore the old build on a full match and never save the new one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-release-${{ hashFiles('Cargo.toml') }}
      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install --locked cargo-ndk --version 4.1.2
      # The jars android_native.sh takes from Maven Central, kept between runs: Maven Central answers runners'
      # shared addresses with 429 when they ask too often, which failed the build. The script checks each file's hash,
      # so a cached file is used only if it is the right one.
      - name: Cache the Maven Central jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/android-native/libs
          key: android-libs-${{ hashFiles('scripts/android_native.sh') }}
          restore-keys: android-libs-
      - name: Build
        env:
          CONSTRUCT_VERSION_NAME: ${{ needs.version.outputs.name }}
          CONSTRUCT_VERSION_CODE: ${{ needs.version.outputs.code }}
          CONSTRUCT_BUILD: ${{ needs.version.outputs.build }}
        run: scripts/android_native.sh --release --unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: build/android-native/aligned.apk
          if-no-files-found: error
          retention-days: 1

  # Signs the APK: only apksigner (scripts/android_sign.sh), no cargo, no cache. The keystore is written to the runner's
  # temp directory just before signing and deleted right after. Only this job uses the `release` Environment, which
  # holds the signing secrets (#437); a pull request's run uses no Environment and signs with a debug key.
  android-sign:
    name: Android release APK
    needs: [version, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned
      # Pull requests never sign with the release key: this step is skipped and the next signs with a debug key.
      - name: Sign with the release key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CONSTRUCT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CONSTRUCT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CONSTRUCT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z $KEYSTORE_BASE64 ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key."
            exit 0
          fi
          export CONSTRUCT_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore
          trap 'rm -f "$CONSTRUCT_ANDROID_KEYSTORE"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$CONSTRUCT_ANDROID_KEYSTORE")
          scripts/android_sign.sh --release unsigned/aligned.apk signed.apk
      - name: Sign with a debug key
        if: hashFiles('signed.apk') == ''
        run: scripts/android_sign.sh --release unsigned/aligned.apk signed.apk
      - name: Name it
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
        run: mkdir -p dist && cp signed.apk "dist/the-construct-$VERSION_NAME.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS app
    needs: version
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      # The root Cargo.toml (its [profile]s) is in the key: rust-cache hashes only Cargo.lock and the members'
      # manifests, so a profile change would restore the old build on a full match and never save the new one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      - name: Build
        env:
          CONSTRUCT_VERSION_NAME: ${{ needs.version.outputs.name }}
          CONSTRUCT_VERSION_CODE: ${{ needs.version.outputs.code }}
          CONSTRUCT_BUILD: ${{ needs.version.outputs.build }}
        run: |
          scripts/macos_app.sh
          mkdir -p dist && cp build/macos/The-Construct.dmg "dist/The-Construct-$CONSTRUCT_VERSION_NAME.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [android-sign, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      # Only the signed APK and the .dmg: never `android-unsigned`, the
      # output of the job that runs every crate's build scripts.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "The Construct $TAG" --generate-notes
