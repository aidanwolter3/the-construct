name: Release

# The Construct's installable builds (decision `rust-clients`):
#   - Android: scripts/android_native.sh --release, a release APK (not debuggable). Signed with the release key when
#     these repository secrets are set, else with a throwaway debug key (and a warning):
#       ANDROID_KEYSTORE_BASE64     the keystore file (.jks or .p12), base64 on one line
#       ANDROID_KEYSTORE_PASSWORD   its password
#       ANDROID_KEY_ALIAS           the key's alias in it
#       ANDROID_KEY_PASSWORD        the key's password (optional: the keystore's password when unset)
#     A pod's App Link sign-in redirect needs this key's SHA-256 fingerprint in the pod's CONSTRUCT_ANDROID_CERT_SHA256
#     (docs/server.md); the job prints it.
#   - macOS: scripts/macos_app.sh, The Construct.app in a .dmg (Apple Silicon, signed ad hoc, not notarized).
#
# A tag `v<version>` (e.g. v0.2.0) publishes both as a GitHub release; a manual run uploads them as the run's
# artifacts. Pull requests that change the build scripts run it too, unsigned and unpublished, so a broken release
# build shows before it merges. The version code is the run number, so each release installs over the previous one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/android_native.sh
      - scripts/macos_app.sh
      - crates/construct-render/android/**

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN: ${{ github.run_number }}
        run: |
          if [[ $REF_TYPE == tag ]]; then name=${REF_NAME#v}; else name="0.1.0-dev.$RUN"; fi
          [[ $name =~ ^[0-9A-Za-z.+-]+$ ]] || { echo "bad version '$name'"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$RUN" >> "$GITHUB_OUTPUT"

  android:
    name: Android release APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the pinned Rust (rust-toolchain.toml) and the Android target
        run: rustup toolchain install && rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-release
      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install --locked cargo-ndk --version 4.1.2
      # The keystore goes to the runner's temp directory (deleted with the runner), never into the workspace.
      # Pull requests never sign.
      - name: Release key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z $KEYSTORE_BASE64 ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "CONSTRUCT_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build
        env:
          CONSTRUCT_VERSION_NAME: ${{ needs.version.outputs.name }}
          CONSTRUCT_VERSION_CODE: ${{ needs.version.outputs.code }}
          CONSTRUCT_ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          CONSTRUCT_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          CONSTRUCT_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          scripts/android_native.sh --release
          rm -f "$RUNNER_TEMP/release.keystore"
          mkdir -p dist && cp build/android-native/construct-render.apk "dist/the-construct-$CONSTRUCT_VERSION_NAME.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS app
    needs: version
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        env:
          CONSTRUCT_VERSION_NAME: ${{ needs.version.outputs.name }}
          CONSTRUCT_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          scripts/macos_app.sh
          mkdir -p dist && cp build/macos/The-Construct.dmg "dist/The-Construct-$CONSTRUCT_VERSION_NAME.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  publish:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "The Construct $TAG" --generate-notes
