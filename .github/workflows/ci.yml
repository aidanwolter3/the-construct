name: CI

# Every PR and push: Rust checks, JVM/shared-UI tests and headless simulator screenshots (artifact).
# Push to main: if Rust checks pass, deploy the pod (and the fake Pixelfed when its files changed) to Fly.io
# staging. A manual run (workflow_dispatch) on main deploys both.
#   https://the-construct-pod.fly.dev   (deploy/fly/pod.toml)
#   https://the-construct-fake-pixelfed.fly.dev   (deploy/fly/fake-pixelfed.toml)
# Deploys need repo secrets FLY_API_TOKEN_POD and FLY_API_TOKEN_FAKE (app-scoped Fly deploy tokens);
# without them the deploy steps are skipped, not failed.
# Third-party actions are pinned to commit SHAs (tag in the comment); Dependabot
# (.github/dependabot.yml) proposes updates.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN; a job that needs more grants it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line numbers in backtraces but no full debug info: smaller test binaries that link
  # faster (the test build went from ~49 s to ~36 s). Release builds are unaffected.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  rust:
    name: Rust (clippy + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.145
      - run: scripts/check_decisions.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # nextest runs tests from different binaries in parallel (cargo test runs one
      # binary at a time); profile in .config/nextest.toml. It skips doctests.
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc

  audit:
    name: Dependency advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      # Checks Cargo.lock against the RustSec advisory database; ignores (with reasons) live in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  jvm:
    name: JVM tests + simulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the Rust engine for the JVM (target/release/libclient_ffi.so)
        run: cargo build -p client-ffi --release
      - name: Shared + desktop tests
        working-directory: kmp-app
        # gradle.properties pins a macOS JDK path; point Gradle at the runner's JDK instead.
        run: ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -PskipRustBuild :shared:allTests :desktopApp:test
      - name: Simulator screenshots (fixture mode)
        working-directory: kmp-app
        run: |
          ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" -PskipRustBuild :desktopApp:simulate \
            -Pworkspace=pixelfed_demo -Pscreen=phone -Pout="$RUNNER_TEMP/sim/pixelfed" \
            -Pscript="shot feed; click Like; assert-text Unlike; shot liked; offline; shot offline"
      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-and-test-reports
          path: |
            ${{ runner.temp }}/sim
            kmp-app/**/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to Fly.io staging
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # The Fly tokens are passed only to the steps that deploy with them (not job-wide), so checkout,
    # setup-flyctl and the smoke test never see them.
    steps:
      - name: Which deploy secrets are set?
        id: secrets
        env:
          HAS_POD: ${{ secrets.FLY_API_TOKEN_POD != '' }}
          HAS_FAKE: ${{ secrets.FLY_API_TOKEN_FAKE != '' }}
        run: |
          echo "pod=$HAS_POD" >> "$GITHUB_OUTPUT"
          echo "fake=$HAS_FAKE" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the diff below needs the push's previous head
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.123
      - name: Did the fake Pixelfed change?
        id: fake
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          paths="crates/fake-pixelfed fixtures/pixelfed Cargo.toml Cargo.lock deploy/fly/fake-pixelfed.toml"
          if [ "$GITHUB_EVENT_NAME" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=true # manual run, or a previous head we can't compare with: deploy
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- $paths; then
            changed=false
          else
            changed=true
          fi
          echo "fake Pixelfed changed: $changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Deploy fake Pixelfed
        if: steps.secrets.outputs.fake == 'true' && steps.fake.outputs.changed == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_FAKE }}
        run: flyctl deploy . --config deploy/fly/fake-pixelfed.toml --dockerfile crates/fake-pixelfed/Dockerfile --remote-only --ha=false
      - name: Deploy pod
        if: steps.secrets.outputs.pod == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_POD }}
        run: flyctl deploy . --config deploy/fly/pod.toml --dockerfile deploy/pod.Dockerfile --remote-only --ha=false
      - name: Smoke test
        if: steps.secrets.outputs.pod == 'true'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://the-construct-pod.fly.dev/healthz) && [ "$code" = 200 ] && break
            sleep 3
          done
          [ "$code" = 200 ] || { echo "healthz returned $code"; exit 1; }
          pod=https://the-construct-pod.fly.dev
          # Without a pod token: only the "Open your pod" screen (D46).
          curl -fsS "$pod/v1/workspaces/pixelfed_demo" | jq -e '.workspace.title == "The Construct"'
          # A temporary pod (deleted when it expires) serves the apps.
          token=$(curl -fsS -X POST "$pod/v1/pods/temporary" | jq -er '.session_token')
          curl -fsS -H "Authorization: Bearer $token" "$pod/v1/workspaces/pixelfed_demo" \
            | jq -e '.workspace.id == "pixelfed_demo" and (.entities | length) > 0'
      - name: Note skipped deploy
        if: steps.secrets.outputs.pod != 'true' || steps.secrets.outputs.fake != 'true'
        run: echo "::warning::FLY_API_TOKEN_POD / FLY_API_TOKEN_FAKE secrets missing; some deploy steps were skipped."
