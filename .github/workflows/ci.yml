name: CI

# Every PR and push: Rust checks, simulator screenshots on the Rust engine (artifact `simulator`), and the Android
#   app built as CI's development APK (scripts/android_native.sh, artifact `android-apk`). Release builds (a signed
#   APK, the macOS app) come from release.yml.
# Push to main (or a manual run on main): if Rust checks pass, deploy the pod to Fly.io staging,
#   https://the-construct-pod.fly.dev   (deploy/fly/pod.toml)
# Weekly on main too, so the pod image's Chromium and Debian packages are rebuilt current even in a week with no
#   push (CHROMIUM_REFRESH in deploy/pod.Dockerfile, decision `browser-sandbox`).
# The fake Pixelfed it talks to deploys from its own workflow (fake-pixelfed.yml).
# The deploy job runs in the `staging` Environment (issue #437), which only `main` may deploy from and which
# holds FLY_API_TOKEN_POD (an app-scoped Fly deploy token); without it the deploy steps are skipped, not failed.
# Third-party actions are pinned to commit SHAs (tag in the comment); Dependabot
# (.github/dependabot.yml) proposes updates.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

# A pull request's new push cancels its run in progress. Every other run (main's pushes, the weekly and manual runs)
# has a group of its own and starts at once: one waited 21 minutes behind the run before it. Deploys still go one at a
# time (the deploy job's own group), and a run whose commit is no longer main's head skips its deploy, so an older
# commit can't replace a newer one on staging.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN; a job that needs more grants it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info for dev/test builds is set in Cargo.toml ([profile.dev]); the Rust
  # version comes from rust-toolchain.toml, the same as local and cloud builds.

jobs:
  # The image the Rust job runs in (.github/ci/Dockerfile, decision `ci-container-image`), tagged with a hash of the
  # Dockerfile and rust-toolchain.toml. Only main publishes it (issue #441): `image` runs on main's pushes, scheduled
  # and manual runs, the only job with `packages: write`. It runs main's Rust job by the digest it recorded in an
  # Actions cache entry, which only main's runs can write (a pull request's cache entries are scoped to its own
  # ref). With no entry for the hash it builds the image, pushes it as `main-<hash>` and records its digest; any
  # other run finds the entry and moves on.
  image:
    name: CI image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which image
        id: tag
        run: echo "hash=$(cat .github/ci/Dockerfile rust-toolchain.toml | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: The digest main recorded for it
        id: recorded
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-image-digest
          key: ci-image-digest-${{ steps.tag.outputs.hash }}
      - name: Build and push it, unless main recorded it
        if: steps.recorded.outputs.cache-hit != 'true'
        env:
          TAG: ghcr.io/${{ github.repository }}-ci:main-${{ steps.tag.outputs.hash }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${TAG,,}
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          ctx=$(mktemp -d)
          cp rust-toolchain.toml "$ctx/"
          docker build --pull -f .github/ci/Dockerfile -t "$TAG" "$ctx"
          docker push "$TAG"
          docker inspect --format '{{index .RepoDigests 0}}' "$TAG" | cut -d@ -f2 > .ci-image-digest
      - name: Record its digest
        if: steps.recorded.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-image-digest
          key: ci-image-digest-${{ steps.tag.outputs.hash }}
      - name: Run it by digest
        id: ref
        run: |
          digest=$(cat .ci-image-digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "bad recorded digest: $digest"; exit 1; }
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}-ci@$digest" >> "$GITHUB_OUTPUT"

  # Every other run (pull requests, manual runs off main) reads the registry and never writes it. When main has
  # published this hash, the Rust job runs in that image; otherwise the pull request changes the image, so this job
  # builds it, without pushing, to show it builds, and the Rust job runs in the image of the pull request's base.
  image-check:
    name: CI image (check)
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Which image
        id: ref
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha || 'main' }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-ci"
          files=(.github/ci/Dockerfile rust-toolchain.toml)
          # main-<hash> by digest; `legacy` also takes the tag CI pushed before main-only publishing (issue #441).
          find_image() {
            local tag digest
            for tag in "main-$1" ${2:+"$1"}; do
              digest=$(docker buildx imagetools inspect "$repo:$tag" --format '{{json .Manifest}}' 2>/dev/null \
                | jq -r '.digest // empty') || true
              [ -n "$digest" ] && { echo "$repo@$digest"; return 0; }
            done
            return 0
          }
          hash=$(cat "${files[@]}" | sha256sum | cut -c1-16)
          ref=$(find_image "$hash")
          if [ -z "$ref" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            git fetch -q --no-tags --depth=1 origin "$BASE"
            base=$(for f in "${files[@]}"; do git show "FETCH_HEAD:$f"; done | sha256sum | cut -c1-16)
            ref=$(find_image "$base" legacy)
            [ -n "$ref" ] || { echo "::error::No CI image for $hash or the base's $base; main's run may still be building it."; exit 1; }
            echo "::notice::This change builds a new CI image; its tests run in the base's ($ref)."
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Build the changed image (not pushed)
        if: steps.ref.outputs.build == 'true'
        run: |
          ctx=$(mktemp -d)
          cp rust-toolchain.toml "$ctx/"
          docker build --pull -f .github/ci/Dockerfile "$ctx"

  rust:
    name: Rust (clippy + tests)
    needs: [image, image-check]
    # One of the two image jobs runs; the other is skipped.
    if: ${{ !cancelled() && (needs.image.result == 'success' || needs.image-check.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    # Everything the job installs is in the image (lavapipe for the GPU tests, cargo-nextest, the pinned Rust).
    # uid 1001 is the runner's user: the workspace is its, and tests that need a non-root user run.
    container:
      image: ${{ needs.image.outputs.ref || needs.image-check.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      - name: The pinned Rust (rust-toolchain.toml; the image has it)
        run: rustup toolchain install
      # The root Cargo.toml (its [profile]s) is in the key: rust-cache hashes only Cargo.lock and the members'
      # manifests, so a profile change would restore the old build on a full match and never save the new one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('Cargo.toml') }}
      # construct-render's GPU tests draw on the image's lavapipe (Mesa's software Vulkan), and must
      # (CONSTRUCT_REQUIRE_GPU below fails them instead of skipping when no adapter is found).
      - run: scripts/check_decisions.sh
      - run: scripts/check_test_data.sh
      - run: scripts/check_old_names.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The engine's window and viewer code (features off in the workspace build).
      - run: cargo clippy -p construct-render --features viewer --all-targets -- -D warnings
      # nextest runs tests from different binaries in parallel (cargo test runs one
      # binary at a time); profile in .config/nextest.toml. It skips doctests.
      - run: cargo nextest run --workspace --profile ci
        env:
          CONSTRUCT_REQUIRE_GPU: "1"
      # The Rust clients' live sessions on the engine (feature `remote`, off in the workspace build).
      - run: cargo nextest run -p construct-render --features remote --profile ci -E 'test(/^engine::/)'
      - run: cargo test --workspace --doc
      # The headless simulator (docs/simulator.md), CPU-drawn: the scenarios' PNGs are what PRs embed.
      - name: Simulator screenshots (construct-sim, fixture mode)
        # In the workspace: inside the container, runner.temp names the host's path.
        run: scripts/sim_scenarios.sh sim-screenshots
      - name: Upload simulator screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator
          path: sim-screenshots
          if-no-files-found: ignore
          retention-days: 14

  audit:
    name: Dependency advisories and sources (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      # Checks Cargo.lock against the RustSec advisory database and the allowed sources (crates.io only); ignores
      # (with reasons) live in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        with:
          command: check advisories sources

  android:
    name: Android APK (cargo-ndk)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The Android app as scripts/android_native.sh builds it on a Mac: the engine cross-compiled with cargo-ndk, the
    # Java bridge (javac + d8), aapt2's manifest and resources, signed with a throwaway debug key. The runner image
    # ships an Android SDK with an NDK (ANDROID_HOME); there is no device, so the script builds only.
    # Warnings fail the build: the Rust job's clippy builds for Linux, so code that only Android compiles (or skips,
    # like the desktop keyring) is linted only here. Job-wide, so rust-cache's key changes with it. Local builds and
    # release.yml's release APK keep warnings as warnings.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the pinned Rust (rust-toolchain.toml) and the Android target
        run: rustup toolchain install && rustup target add aarch64-linux-android
      # The root Cargo.toml (its [profile]s) is in the key: rust-cache hashes only Cargo.lock and the members'
      # manifests, so a profile change would restore the old build on a full match and never save the new one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-${{ hashFiles('Cargo.toml') }}
      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install --locked cargo-ndk --version 4.1.2
      # The jars android_native.sh takes from Maven Central, kept between runs: Maven Central answers runners'
      # shared addresses with 429 when they ask too often, which failed the build. The script checks each file's hash,
      # so a cached file is used only if it is the right one.
      - name: Cache the Maven Central jars
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/android-native/libs
          key: android-libs-${{ hashFiles('scripts/android_native.sh') }}
          restore-keys: android-libs-
      - run: scripts/android_native.sh
      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: build/android-native/construct-render.apk
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web client (wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The web client (decision `web-client`): construct-web built for wasm32 with the wasm-bindgen CLI pinned to
    # Cargo.lock's version, as scripts/web_build.sh builds it, a size budget on the gzipped WebAssembly, and the
    # browser end-to-end tests. It isn't deployed: the server serves it only with CONSTRUCT_WEB=1.
    # Warnings fail the build here too (clippy and the release-profile build), as in the Android job.
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      - name: Install the pinned Rust (rust-toolchain.toml) and the wasm32 target
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      # The root Cargo.toml (its [profile]s) is in the key: rust-cache hashes only Cargo.lock and the members'
      # manifests, so a profile change would restore the old build on a full match and never save the new one.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: web-${{ hashFiles('Cargo.toml') }}
      - name: Install the wasm-bindgen CLI at Cargo.lock's version
        run: |
          v=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep version | cut -d'"' -f2)
          [ "$(wasm-bindgen --version 2>/dev/null | cut -d' ' -f2)" = "$v" ] || cargo install --locked wasm-bindgen-cli --version "$v"
      - name: Clippy on the browser-only code
        run: cargo clippy -p construct-web -p construct-render --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - run: scripts/web_build.sh target/web
      - name: Size budget (gzipped WebAssembly at most 2.5 MiB)
        run: |
          size=$(gzip -9 -c target/web/construct_web_bg.*.wasm | wc -c)
          echo "gzipped: $size bytes"
          [ "$size" -le 2621440 ]
      # The client driven in Chromium against a real server and the fake Pixelfed (scripts/web_e2e.sh: the owner's
      # pod, a public link, a site of another origin). A panic in the page fails it (issue #543). The runner's Node
      # with Playwright pinned, installed globally where the script's NODE_PATH looks.
      - name: Install Playwright and Chromium
        run: npm install -g playwright@1.63.0 && npx -y playwright@1.63.0 install --with-deps chromium
      - name: Browser end-to-end (scripts/web_e2e.sh)
        run: scripts/web_e2e.sh target/web-e2e
      - name: Upload the browser end-to-end screenshots and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-e2e
          path: target/web-e2e
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to Fly.io staging
    # needs.rust.result: the skipped image job would otherwise skip this one too. A failing audit (a new
    # RustSec advisory, an unknown source) blocks the deploy: fix or ignore it in deny.toml first.
    if: >-
      !cancelled() && needs.rust.result == 'success' && needs.audit.result == 'success' && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    needs: [rust, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Environment's deployment-branch rule (main only) keeps its secret from a run on any other ref, even one a
    # pushed branch's own workflow starts (#437).
    environment:
      name: staging
      url: https://the-construct-pod.fly.dev
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # The Fly token is passed only to the step that deploys with it (not job-wide), so checkout,
    # setup-flyctl and the smoke test never see it.
    steps:
      - name: Which deploy secrets are set?
        id: secrets
        env:
          HAS_POD: ${{ secrets.FLY_API_TOKEN_POD != '' }}
        run: echo "pod=$HAS_POD" >> "$GITHUB_OUTPUT"
      # Main's runs run side by side, so a newer commit's run may have deployed already: only main's head deploys.
      # Checked once this job holds the deploy group, so a run that waited behind another deploy checks afresh.
      - name: Is this commit still main's head?
        id: head
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          [ -n "$head" ] || { echo "::error::Could not read main's head."; exit 1; }
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is at $head now; its run deploys that, so this run ($GITHUB_SHA) doesn't."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.123
      - name: Deploy pod
        if: steps.secrets.outputs.pod == 'true' && steps.head.outputs.deploy == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_POD }}
        # The ISO week: Chromium's apt layer is rebuilt once a week (decision `browser-sandbox`). The build id:
        # the one the server and its web client report (decision `device-versions`). Built here on the runner
        # (16 GB) and pushed, not on Fly's remote builder, which ran out of memory compiling the server (decision
        # `deploy-builds-on-the-runner`).
        run: >-
          flyctl deploy . --config deploy/fly/pod.toml --dockerfile deploy/pod.Dockerfile --local-only --ha=false
          --build-arg CHROMIUM_REFRESH="$(date -u +%G-W%V)"
          --build-arg CONSTRUCT_BUILD="$(scripts/build_id.sh)"
      - name: Smoke test
        if: steps.secrets.outputs.pod == 'true' && steps.head.outputs.deploy == 'true'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://the-construct-pod.fly.dev/healthz) && [ "$code" = 200 ] && break
            sleep 3
          done
          [ "$code" = 200 ] || { echo "healthz returned $code"; exit 1; }
          pod=https://the-construct-pod.fly.dev
          # Without a pod token: a one-element construct asking for a pod code (D46).
          root=$(curl -fsS "$pod/v1/construct" | jq -er '.root')
          curl -fsS "$pod/v1/objects/$root" | jq -e '.kind == "element" and (tojson | contains("pod_token"))'
          # A temporary pod (deleted when it expires) serves its construct and its data. When staging already has
          # its most temporary pods (CONSTRUCT_TEMP_POD_MAX; sessions make them, and each lives 24 h unless deleted),
          # the server answers 503 temporary_pods_full: the deploy is fine, so warn and skip this part.
          made=$(curl -sS -X POST "$pod/v1/pods/temporary" -w '\n%{http_code}' \
            -H "X-Construct-Client: ci-smoke-test run $GITHUB_RUN_ID")
          status=$(tail -n1 <<<"$made")
          if [ "$status" = 503 ] && head -n -1 <<<"$made" | jq -e '.error == "temporary_pods_full"' >/dev/null; then
            echo "::warning::Staging's temporary pods are full; the smoke test's temporary-pod checks were skipped."
            exit 0
          fi
          [ "$status" = 200 ] || { echo "POST /v1/pods/temporary returned $status"; exit 1; }
          token=$(head -n -1 <<<"$made" | jq -er '.session_token')
          # Give the slot back when done, pass or fail, instead of holding it for 24 h.
          trap 'curl -sS -X DELETE -H "Authorization: Bearer $token" "$pod/v1/pods/temporary" || true' EXIT
          root=$(curl -fsS -H "Authorization: Bearer $token" "$pod/v1/construct" | jq -er '.root')
          curl -fsS -H "Authorization: Bearer $token" "$pod/v1/objects/$root" \
            | jq -e '.kind == "element" and .node.id == "home"'
          curl -fsS -H "Authorization: Bearer $token" "$pod/v1/construct/data/$root" \
            | jq -e '(.entities | length) > 0'
      - name: Note skipped deploy
        if: steps.secrets.outputs.pod != 'true' && steps.head.outputs.deploy == 'true'
        run: echo "::warning::FLY_API_TOKEN_POD secret missing; the deploy and smoke test were skipped."
