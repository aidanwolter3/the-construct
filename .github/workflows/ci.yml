name: CI

# Every PR and push: Rust checks, JVM/shared-UI tests, headless simulator screenshots (artifact) and an
#   Android compile (Kotlin only, no Rust .so files).
# Push to main (or a manual run on main): if Rust checks pass, deploy the pod to Fly.io staging,
#   https://the-construct-pod.fly.dev   (deploy/fly/pod.toml)
# The fake Pixelfed it talks to deploys from its own workflow (fake-pixelfed.yml).
# The deploy needs the repo secret FLY_API_TOKEN_POD (an app-scoped Fly deploy token); without it
# the deploy steps are skipped, not failed.
# Third-party actions are pinned to commit SHAs (tag in the comment); Dependabot
# (.github/dependabot.yml) proposes updates.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege for GITHUB_TOKEN; a job that needs more grants it itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Debug info for dev/test builds is set in Cargo.toml ([profile.dev]); the Rust
  # version comes from rust-toolchain.toml, the same as local and cloud builds.

jobs:
  rust:
    name: Rust (clippy + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      - name: Install the pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@37f7c5781271959fb65b6b35224e28652ff2b63d # v2.87.0
        with:
          tool: cargo-nextest@0.9.145
      # lavapipe (Mesa's software Vulkan): construct-render's GPU tests draw on it, and must
      # (CONSTRUCT_REQUIRE_GPU below fails them instead of skipping when no adapter is found).
      - name: Install a software Vulkan driver
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers
      - run: scripts/check_decisions.sh
      - run: scripts/check_test_data.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The engine's window and viewer code (features off in the workspace build).
      - run: cargo clippy -p construct-render --features viewer --all-targets -- -D warnings
      # nextest runs tests from different binaries in parallel (cargo test runs one
      # binary at a time); profile in .config/nextest.toml. It skips doctests.
      - run: cargo nextest run --workspace --profile ci
        env:
          CONSTRUCT_REQUIRE_GPU: "1"
      # The Rust clients' live sessions on the engine (feature `remote`, off in the workspace build).
      - run: cargo nextest run -p construct-render --features remote --profile ci -E 'test(/^engine::/)'
      - run: cargo test --workspace --doc

  audit:
    name: Dependency advisories (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      # Checks Cargo.lock against the RustSec advisory database; ignores (with reasons) live in deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  jvm:
    name: JVM tests + simulator screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install the pinned Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the Rust engine for the JVM (target/release/libclient_ffi.so)
        run: cargo build -p client-ffi --release
      - name: Shared + desktop tests
        working-directory: app
        run: ./gradlew -PskipRustBuild :shared:allTests :desktopApp:test
      - name: Simulator screenshots (fixture mode)
        working-directory: app
        run: |
          ./gradlew -PskipRustBuild :desktopApp:simulate \
            -Pworkspace=pixelfed_sample_no_login -Pscreen=phone -Pout="$RUNNER_TEMP/sim/pixelfed" \
            -Pscript="shot feed; click Like; assert-text Unlike; shot liked; offline; shot offline"
      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simulator-and-test-reports
          path: |
            ${{ runner.temp }}/sim
            app/**/build/reports/tests
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Compiles the Android Kotlin (:shared's android target and :androidApp), which the JVM job never builds.
    # Compile-only: -PskipRustBuild skips the cargo-ndk engine build (the UniFFI bindings are checked in). The
    # runner image ships an Android SDK (ANDROID_HOME); AGP fetches a missing platform itself.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no job pushes; keep GITHUB_TOKEN out of .git/config
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Compile shared (android) + androidApp
        working-directory: app
        run: ./gradlew -PskipRustBuild :shared:compileAndroidMain :androidApp:compileDebugKotlin

  deploy:
    name: Deploy to Fly.io staging
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    # The Fly token is passed only to the step that deploys with it (not job-wide), so checkout,
    # setup-flyctl and the smoke test never see it.
    steps:
      - name: Which deploy secrets are set?
        id: secrets
        env:
          HAS_POD: ${{ secrets.FLY_API_TOKEN_POD != '' }}
        run: echo "pod=$HAS_POD" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.123
      - name: Deploy pod
        if: steps.secrets.outputs.pod == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_POD }}
        run: flyctl deploy . --config deploy/fly/pod.toml --dockerfile deploy/pod.Dockerfile --remote-only --ha=false
      - name: Smoke test
        if: steps.secrets.outputs.pod == 'true'
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://the-construct-pod.fly.dev/healthz) && [ "$code" = 200 ] && break
            sleep 3
          done
          [ "$code" = 200 ] || { echo "healthz returned $code"; exit 1; }
          pod=https://the-construct-pod.fly.dev
          # Without a pod token: only the "Open your pod" screen (D46).
          curl -fsS "$pod/v1/workspaces/pixelfed_sample_no_login" | jq -e '.workspace.title == "The Construct"'
          # A temporary pod (deleted when it expires) serves the apps.
          token=$(curl -fsS -X POST "$pod/v1/pods/temporary" | jq -er '.session_token')
          curl -fsS -H "Authorization: Bearer $token" "$pod/v1/workspaces/pixelfed_sample_no_login" \
            | jq -e '.workspace.id == "pixelfed_sample_no_login" and (.entities | length) > 0'
      - name: Note skipped deploy
        if: steps.secrets.outputs.pod != 'true' || steps.secrets.outputs.fake != 'true'
        run: echo "::warning::FLY_API_TOKEN_POD / FLY_API_TOKEN_FAKE secrets missing; some deploy steps were skipped."
